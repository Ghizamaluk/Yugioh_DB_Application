<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YGO – Tutte le Carte</title>
<link rel="stylesheet" href="lang.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a1a; color: #e0e0e0; }

  /* ── Top bar ── */
  #topbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 20px; background: #12122a;
    border-bottom: 2px solid #4a1a8a; height: 52px;
  }
  #topbar .back-btn {
    background: none; border: 1px solid #444; border-radius: 6px;
    color: #aaa; padding: 4px 12px; cursor: pointer; font-size: 0.8rem;
    text-decoration: none; display: flex; align-items: center; gap: 5px;
  }
  #topbar .back-btn:hover { border-color: #9b59b6; color: #c39bd3; }
  #topbar h1 { font-size: 1rem; color: #c39bd3; flex: 0 0 auto; }
  #topbar .filter-sep { width: 1px; height: 20px; background: #333; }

  /* ── Filters ── */
  #filters {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 20px; background: #0f0f20; border-bottom: 1px solid #1a1a2a;
  }
  .fbtn {
    background: #1e1e3a; color: #ccc; border: 1px solid #333;
    border-radius: 6px; padding: 4px 12px; font-size: 0.78rem; cursor: pointer;
    transition: all 0.12s;
  }
  .fbtn:hover { background: #2a2a4a; }
  .fbtn.active { border-color: #9b59b6; color: #c39bd3; background: #1e0e2e; }
  .fbtn.f-forb.active   { border-color: #c0392b; color: #e74c3c; background: #1e0000; }
  .fbtn.f-lim.active    { border-color: #e67e22; color: #e67e22; background: #1a1000; }
  .fbtn.f-semi.active   { border-color: #f0b429; color: #f0b429; background: #1a1400; }
  .fbtn.f-unlim.active  { border-color: #27ae60; color: #2ecc71; background: #001a08; }
  select.fsel {
    background: #1e1e3a; color: #ccc; border: 1px solid #333;
    border-radius: 6px; padding: 4px 8px; font-size: 0.78rem; cursor: pointer;
  }
  #search-box {
    background: #1e1e3a; color: #e0e0e0; border: 1px solid #333;
    border-radius: 6px; padding: 4px 10px; font-size: 0.78rem; width: 200px;
  }
  #card-count { font-size: 0.75rem; color: #666; margin-left: auto; white-space: nowrap; }

  /* ── Loading ── */
  #loading {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 60vh; gap: 14px; color: #666;
  }
  .spinner {
    width: 44px; height: 44px; border: 3px solid #222; border-top-color: #9b59b6;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Table ── */
  #table-wrap {
    height: calc(100vh - 100px);
    overflow-y: auto;
  }
  #table-wrap::-webkit-scrollbar { width: 6px; background: #111; }
  #table-wrap::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  thead { position: sticky; top: 0; z-index: 10; }
  th {
    background: #111125; color: #666; padding: 9px 12px; text-align: left;
    font-weight: 600; text-transform: uppercase; font-size: 0.68rem;
    letter-spacing: 0.5px; cursor: pointer; user-select: none; white-space: nowrap;
    border-bottom: 1px solid #1a1a2a;
  }
  th:hover { color: #bbb; }
  td { padding: 7px 12px; border-bottom: 1px solid #0e0e1e; }
  tr:nth-child(even) td { background: #0c0c1c; }
  tr[data-ci]:hover td { background: #131328; cursor: pointer; }

  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; white-space: nowrap; }
  .badge.Forbidden    { background: #1e0000; color: #e74c3c; border: 1px solid #c0392b; }
  .badge.Limited      { background: #1a1000; color: #e67e22; border: 1px solid #e67e22; }
  .badge.Semi-Limited { background: #1a1400; color: #f0b429; border: 1px solid #f0b429; }
  .badge.Unlimited    { background: #001a08; color: #2ecc71; border: 1px solid #27ae60; }
  .type-b { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 0.7rem; }
  .type-b.Monster { background: #1a0a00; color: #e67e22; border: 1px solid #7a3a00; }
  .type-b.Spell   { background: #00100a; color: #1abc9c; border: 1px solid #0a5a3a; }
  .type-b.Trap    { background: #12001a; color: #9b59b6; border: 1px solid #5a1a7a; }
  .type-b.Other   { background: #111; color: #888; border: 1px solid #333; }

  /* ── Pagination ── */
  #pagination {
    display: flex; gap: 6px; justify-content: center; padding: 12px; flex-wrap: wrap;
    position: sticky; bottom: 0; background: #0a0a1a; border-top: 1px solid #1a1a2a;
  }
  #pagination button {
    padding: 4px 10px; border-radius: 5px; border: 1px solid #2a2a3a;
    background: #111; color: #888; cursor: pointer; font-size: 0.78rem;
  }
  #pagination button:disabled { opacity: 0.3; cursor: default; }
  #pagination button:not(:disabled):hover,
  #pagination button.pactive { background: #151535; color: #fff; border-color: #9b59b6; }

  /* ── Popup ── */
  #popup-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.8); z-index: 100;
    align-items: center; justify-content: center;
  }
  #popup-overlay.active { display: flex; }
  #popup {
    background: #1a1a2e; border: 1px solid #9b59b6; border-radius: 10px;
    padding: 24px; max-width: 780px; width: 94%;
    display: flex; gap: 20px; position: relative;
    max-height: 90vh; overflow-y: auto;
  }
  #popup-close {
    position: absolute; top: 10px; right: 14px;
    background: none; border: none; color: #aaa; font-size: 1.4rem; cursor: pointer;
  }
  #popup-close:hover { color: #c0392b; }
  #popup-img { flex: 0 0 160px; display: flex; align-items: flex-start; justify-content: center; }
  #popup-img img {
    width: 160px; border-radius: 6px; border: 1px solid #444;
    cursor: zoom-in; transition: transform 0.15s;
  }
  #popup-img img:hover { transform: scale(1.04); }
  #popup-img .no-img {
    width: 160px; height: 220px; background: #1e1e3a; border-radius: 6px;
    display: flex; align-items: center; justify-content: center; color: #444; font-size: 0.7rem;
  }
  #popup-info { flex: 1; }
  #popup-name { font-size: 1.2rem; font-weight: bold; color: #c39bd3; margin-bottom: 8px; }
  #popup-meta { font-size: 0.85rem; color: #aaa; margin-bottom: 12px; line-height: 1.7; }
  #popup-desc { font-size: 0.85rem; line-height: 1.6; color: #ccc; }

  /* zoom overlay */
  #zoom-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.92); z-index: 200;
    align-items: center; justify-content: center; cursor: zoom-out;
  }
  #zoom-overlay.active { display: flex; }
  #zoom-overlay img {
    max-width: min(421px, 90vw); max-height: 90vh;
    border-radius: 10px; border: 2px solid #9b59b6; pointer-events: none;
  }
</style>
</head>
<body>

<div id="topbar">
  <a class="back-btn" href="index.html">&#8592; Home</a>
  <div class="filter-sep"></div>
  <h1>&#9829; Tutte le Carte YGO</h1>
  <div style="margin-left:auto"><div id="lang-container"></div></div>
</div>

<div id="filters">
  <span style="font-size:0.78rem;color:#888">Status:</span>
  <button class="fbtn f-all active" onclick="setStatus('',this)">Tutti</button>
  <button class="fbtn f-forb"  onclick="setStatus('Forbidden',this)">Forbidden</button>
  <button class="fbtn f-lim"   onclick="setStatus('Limited',this)">Limited</button>
  <button class="fbtn f-semi"  onclick="setStatus('Semi-Limited',this)">Semi-Limited</button>
  <button class="fbtn f-unlim" onclick="setStatus('Unlimited',this)">Unlimited</button>
  <div style="width:1px;height:18px;background:#333;margin:0 4px"></div>
  <span style="font-size:0.78rem;color:#888">Tipo:</span>
  <button class="fbtn active" onclick="setType('',this)">Tutti</button>
  <button class="fbtn" onclick="setType('Monster',this)">Monster</button>
  <button class="fbtn" onclick="setType('Spell',this)">Spell</button>
  <button class="fbtn" onclick="setType('Trap',this)">Trap</button>
  <div style="width:1px;height:18px;background:#333;margin:0 4px"></div>
  <input id="search-box" type="text" placeholder="Cerca carta..." oninput="applyFilters()">
  <span id="card-count"></span>
</div>

<div id="loading"><div class="spinner"></div><span>Caricamento carte...</span></div>
<div id="table-wrap" style="display:none">
  <table>
    <thead><tr>
      <th onclick="sortBy('name')">Nome &#8597;</th>
      <th onclick="sortBy('status')">Status &#8597;</th>
      <th onclick="sortBy('type')">Tipo &#8597;</th>
      <th onclick="sortBy('subtype')">Sottotipo &#8597;</th>
      <th onclick="sortBy('atk')">ATK &#8597;</th>
      <th onclick="sortBy('def')">DEF &#8597;</th>
      <th onclick="sortBy('level')">Lv &#8597;</th>
      <th onclick="sortBy('attribute')">Attr &#8597;</th>
      <th onclick="sortBy('tcg_date')">Rilascio &#8597;</th>
      <th>Set</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="pagination"></div>
</div>

<div id="zoom-overlay"><img id="zoom-img" src="" alt=""></div>

<div id="popup-overlay">
  <div id="popup">
    <button id="popup-close">&#x2715;</button>
    <div id="popup-img"></div>
    <div id="popup-info">
      <div id="popup-name"></div>
      <div id="popup-meta"></div>
      <div id="popup-desc"></div>
    </div>
  </div>
</div>

<script src="lang.js"></script>
<script>
const PAGE = 50;
let ALL = [], filtered = [], page = 1, statusF = '', typeF = '', sortK = 'name', sortAsc = true;
const _langCache = {}; // lang code → array of cards

function getType(t) {
  if (!t) return 'Other';
  if (t.includes('Monster')) return 'Monster';
  if (t.includes('Spell'))   return 'Spell';
  if (t.includes('Trap'))    return 'Trap';
  return 'Other';
}
function statusTCG(info) {
  if (!info) return 'Unlimited';
  return info.ban_tcg || 'Unlimited';
}

let SETS_MAP = {}; // set_code → {date, name}

function setCodePrefix(code) {
  return code.replace(/-?\d+[A-Z]*$/, '');
}
function earliestSet(card_sets) {
  if (!card_sets || !card_sets.length) return { date: '', name: '' };
  let best = null, bestDate = null;
  card_sets.forEach(s => {
    const prefix = setCodePrefix(s.set_code || '');
    const info = SETS_MAP[prefix] || SETS_MAP[prefix.split('-')[0]];
    if (info && info.date) {
      if (!bestDate || info.date < bestDate) {
        bestDate = info.date;
        best = { date: info.date, name: info.name };
      }
    }
  });
  return best || { date: '', name: card_sets[0].set_name || '' };
}

async function fetchSetsMap() {
  if (Object.keys(SETS_MAP).length > 0) return;
  try {
    const res = await fetch('https://db.ygoprodeck.com/api/v7/cardsets.php');
    if (!res.ok) return;
    const sets = await res.json();
    sets.forEach(s => {
      if (s.set_code && s.tcg_date) {
        SETS_MAP[s.set_code] = { date: s.tcg_date, name: s.set_name || s.set_code };
      }
    });
  } catch(e) { /* fallback: sets stay empty, dates won't show */ }
}

async function loadData() {
  const lang = getLang();
  if (_langCache[lang]) {
    ALL = _langCache[lang];
    document.getElementById('loading').style.display = 'none';
    document.getElementById('table-wrap').style.display = 'block';
    applyFilters();
    return;
  }
  try {
    await fetchSetsMap();
    const langParam = apiLangParam();
    let all = [], offset = 0, num = 500;
    while (true) {
      const res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?num=${num}&offset=${offset}${langParam}`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      const batch = json.data || [];
      all = all.concat(batch);
      if (batch.length < num) break;
      offset += num;
    }
    ALL = all.map(c => {
      const es = earliestSet(c.card_sets);
      return {
        name:      c.name,
        type:      getType(c.type || ''),
        subtype:   c.humanReadableCardType || c.type || '',
        atk:       c.atk != null ? c.atk : null,
        def:       c.def != null ? c.def : null,
        level:     c.level != null ? c.level : null,
        attribute: c.attribute || '',
        status:    statusTCG(c.banlist_info),
        desc:      c.desc || '',
        img_small: (c.card_images && c.card_images[0]) ? c.card_images[0].image_url_small : '',
        img:       (c.card_images && c.card_images[0]) ? c.card_images[0].image_url : '',
        tcg_date:  es.date,
        set_name:  es.name,
      };
    });
    _langCache[lang] = ALL;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('table-wrap').style.display = 'block';
    applyFilters();
  } catch(e) {
    document.getElementById('loading').innerHTML = '<span style="color:#e74c3c">Errore: ' + e.message + '</span>';
  }
}

function setStatus(s, el) {
  statusF = s;
  document.querySelectorAll('.fbtn.f-all,.fbtn.f-forb,.fbtn.f-lim,.fbtn.f-semi,.fbtn.f-unlim')
    .forEach(b => b.classList.remove('active'));
  el.classList.add('active'); page = 1; applyFilters();
}
function setType(t, el) {
  typeF = t;
  // reset type buttons
  el.closest('#filters').querySelectorAll('.fbtn:not(.f-all):not(.f-forb):not(.f-lim):not(.f-semi):not(.f-unlim)')
    .forEach(b => b.classList.remove('active'));
  el.classList.add('active'); page = 1; applyFilters();
}
function sortBy(k) {
  if (sortK === k) sortAsc = !sortAsc; else { sortK = k; sortAsc = true; }
  applyFilters();
}
function applyFilters() {
  const q = document.getElementById('search-box').value.toLowerCase();
  filtered = ALL.filter(c => {
    if (statusF && c.status !== statusF) return false;
    if (typeF   && c.type   !== typeF)   return false;
    if (q && !c.name.toLowerCase().includes(q)) return false;
    return true;
  });
  filtered.sort((a, b) => {
    let va = a[sortK] ?? '', vb = b[sortK] ?? '';
    if (['atk','def','level'].includes(sortK)) { va = va===null?-1:va; vb = vb===null?-1:vb; }
    else { va = String(va).toLowerCase(); vb = String(vb).toLowerCase(); }
    return sortAsc ? (va<vb?-1:va>vb?1:0) : (va<vb?1:va>vb?-1:0);
  });
  document.getElementById('card-count').textContent = filtered.length.toLocaleString('it') + ' carte';
  renderTable(); renderPagination();
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderTable() {
  const start = (page - 1) * PAGE;
  document.getElementById('tbody').innerHTML = filtered.slice(start, start + PAGE).map((c, i) => {
    const si = start + i;
    const atk = c.atk !== null ? c.atk : '';
    const def = c.def !== null ? c.def : '';
    const lv  = c.level !== null ? c.level : '';
    return `<tr data-ci="${si}" onclick="openCard(${si})">
      <td><strong>${esc(c.name)}</strong></td>
      <td><span class="badge ${c.status}">${c.status}</span></td>
      <td><span class="type-b ${c.type}">${c.type}</span></td>
      <td style="color:#777;font-size:0.78rem">${esc(c.subtype)}</td>
      <td style="text-align:center;color:#e67e22">${atk}</td>
      <td style="text-align:center;color:#6699ff">${def}</td>
      <td style="text-align:center;color:#f0b429">${lv}</td>
      <td style="color:#88ccff">${esc(c.attribute)}</td>
      <td style="color:#888;font-size:0.78rem">${c.tcg_date}</td>
      <td style="color:#777;font-size:0.75rem;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(c.set_name)}">${esc(c.set_name)}</td>
    </tr>`;
  }).join('');
}

function renderPagination() {
  const tot = Math.ceil(filtered.length / PAGE);
  const p = document.getElementById('pagination');
  if (tot <= 1) { p.innerHTML = ''; return; }
  let h = `<button ${page===1?'disabled':''} onclick="goPage(${page-1})">&#8249;</button>`;
  const range = [];
  for (let i = 1; i <= tot; i++) {
    if (i===1||i===tot||(i>=page-2&&i<=page+2)) range.push(i);
    else if (range[range.length-1]!=='...') range.push('...');
  }
  range.forEach(r => {
    if (r==='...') h += '<span style="color:#555;padding:0 6px">…</span>';
    else h += `<button class="${r===page?'pactive':''}" onclick="goPage(${r})">${r}</button>`;
  });
  h += `<button ${page===tot?'disabled':''} onclick="goPage(${page+1})">&#8250;</button>`;
  p.innerHTML = h;
}

function goPage(n) {
  const tot = Math.ceil(filtered.length / PAGE);
  if (n < 1 || n > tot) return;
  page = n; renderTable(); renderPagination();
  document.getElementById('table-wrap').scrollTo({top: 0, behavior: 'smooth'});
}

function openCard(idx) {
  const c = filtered[idx];
  const imgDiv = document.getElementById('popup-img');
  if (c.img_small) {
    imgDiv.innerHTML = `<img src="${esc(c.img_small)}" alt="${esc(c.name)}" title="Click to zoom" onerror="this.parentNode.innerHTML='<div class=no-img>No image</div>'">`;
    const img = imgDiv.querySelector('img');
    if (img) img.addEventListener('click', () => {
      document.getElementById('zoom-img').src = c.img || c.img_small;
      document.getElementById('zoom-overlay').classList.add('active');
    });
  } else {
    imgDiv.innerHTML = '<div class="no-img">No image</div>';
  }
  document.getElementById('popup-name').textContent = c.name;

  let meta = `<span style="color:#ccc">${esc(c.subtype)}</span>`;
  meta += `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">`;
  meta += `<span class="badge ${c.status}">${c.status}</span>`;
  if (c.atk !== null) meta += `<span><span style="color:#888;font-size:0.8rem">ATK</span> <span style="color:#e67e22">${c.atk}</span></span>`;
  if (c.def !== null) meta += `<span><span style="color:#888;font-size:0.8rem">DEF</span> <span style="color:#6699ff">${c.def}</span></span>`;
  if (c.level !== null) meta += `<span><span style="color:#888;font-size:0.8rem">Lv</span> <span style="color:#f0b429">${c.level}</span></span>`;
  if (c.attribute) meta += `<span><span style="color:#888;font-size:0.8rem">Attr</span> <span style="color:#88ccff">${esc(c.attribute)}</span></span>`;
  meta += `</div>`;
  if (c.tcg_date) meta += `<div style="margin-top:8px"><span style="color:#888;font-size:0.8rem">Rilascio TCG:</span> <span style="color:#f0b429;font-weight:bold">${c.tcg_date}</span></div>`;
  if (c.set_name) meta += `<div style="margin-top:4px"><span style="color:#888;font-size:0.8rem">Primo set:</span> <span style="color:#c8e8ff">${esc(c.set_name)}</span></div>`;
  document.getElementById('popup-meta').innerHTML = meta;
  const descEl = document.getElementById('popup-desc');
  descEl.textContent = c.desc || '';
  document.getElementById('popup-overlay').classList.add('active');
}

document.getElementById('popup-close').addEventListener('click', () => document.getElementById('popup-overlay').classList.remove('active'));
document.getElementById('popup-overlay').addEventListener('click', e => { if (e.target === document.getElementById('popup-overlay')) document.getElementById('popup-overlay').classList.remove('active'); });
document.getElementById('zoom-overlay').addEventListener('click', () => document.getElementById('zoom-overlay').classList.remove('active'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('zoom-overlay').classList.remove('active');
    document.getElementById('popup-overlay').classList.remove('active');
  }
});

loadData();
initLangSwitcher('lang-container', () => {
  ALL = [];
  document.getElementById('loading').style.display = 'block';
  document.getElementById('table-wrap').style.display = 'none';
  loadData();
});
</script>
</body>
</html>

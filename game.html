<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Banni o la Giochi?</title>
<link rel="stylesheet" href="lang.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #07071a; color: #e0e0e0;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  }

  /* Top bar */
  #topbar {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 10px 20px; background: #12122a;
    border-bottom: 2px solid #9b59b6;
  }
  .back-btn {
    background: none; border: 1px solid #444; border-radius: 6px;
    color: #aaa; padding: 4px 12px; font-size: 0.8rem;
    text-decoration: none; display: flex; align-items: center; gap: 5px;
  }
  .back-btn:hover { border-color: #9b59b6; color: #c39bd3; }
  #topbar h1 { font-size: 1rem; color: #c39bd3; }
  #lang-container { margin-left: auto; }

  /* Score bar */
  #scorebar {
    display: flex; gap: 24px; padding: 8px 24px;
    background: #0f0f20; border-bottom: 1px solid #1a1a2a;
    width: 100%; justify-content: center; align-items: center;
  }
  .score-item { display: flex; flex-direction: column; align-items: center; }
  .score-num { font-size: 1.3rem; font-weight: bold; }
  .score-label { font-size: 0.65rem; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
  .s-correct .score-num { color: #2ecc71; }
  .s-wrong   .score-num { color: #e74c3c; }
  .s-remain  .score-num { color: #9b59b6; }
  .score-sep { width: 1px; height: 28px; background: #1a1a2a; }

  /* Progress */
  #progress-wrap {
    width: 100%; max-width: 480px; padding: 10px 20px 0;
  }
  #progress-bar-bg {
    width: 100%; height: 4px; background: #1a1a2a; border-radius: 4px; overflow: hidden;
  }
  #progress-bar { height: 4px; background: #9b59b6; border-radius: 4px; transition: width 0.4s; }
  #progress-label { font-size: 0.7rem; color: #444; text-align: right; margin-top: 3px; }

  /* Main game area */
  #game {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 480px; padding: 16px 20px; gap: 20px;
  }

  /* Result indicator — hidden by default */
  #result-indicator {
    font-size: 5rem; line-height: 1;
    visibility: hidden;
    transition: transform 0.2s;
    min-height: 80px; display: flex; align-items: center; justify-content: center;
  }
  #result-indicator.show { visibility: visible; animation: popIn 0.3s ease; }
  @keyframes popIn { 0% { transform: scale(0.4); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }

  /* Card */
  #card-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
  #card-img {
    width: 220px; height: auto; border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    pointer-events: none;
    transition: box-shadow 0.3s;
  }
  #card-img.correct { box-shadow: 0 0 28px rgba(46,204,113,0.6); }
  #card-img.wrong   { box-shadow: 0 0 28px rgba(192,57,43,0.6); }
  #card-name    { font-size: 1rem; font-weight: bold; color: #c39bd3; text-align: center; }
  #card-name-en { font-size: 0.7rem; color: #333; text-align: center; }

  /* Answer buttons */
  #buttons {
    display: flex; gap: 14px; width: 100%;
  }
  .ans-btn {
    flex: 1; padding: 14px 8px; border-radius: 12px;
    font-size: 0.9rem; font-weight: bold; cursor: pointer;
    border: 2px solid transparent; transition: all 0.15s;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    user-select: none;
  }
  .ans-btn .bicon { font-size: 1.5rem; }
  .ans-btn .blabel { font-size: 0.7rem; opacity: 0.7; }
  #btn-banned { background: #1e0000; border-color: #c0392b; color: #e74c3c; }
  #btn-banned:hover { background: #2e0000; border-color: #e74c3c; transform: translateY(-2px); }
  #btn-free   { background: #001a08; border-color: #27ae60; color: #2ecc71; }
  #btn-free:hover   { background: #002a12; border-color: #2ecc71; transform: translateY(-2px); }

  /* Next button */
  #btn-next {
    display: none;
    padding: 12px 40px; border-radius: 10px;
    background: #1e1e3a; border: 2px solid #9b59b6; color: #c39bd3;
    font-size: 0.95rem; font-weight: bold; cursor: pointer;
    transition: all 0.15s; align-self: center;
  }
  #btn-next:hover { background: #2a1a3a; border-color: #c39bd3; }
  #btn-next.visible { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Shortcut hint */
  #hint { font-size: 0.65rem; color: #252535; text-align: center; }

  /* End screen */
  #end-screen {
    display: none; flex-direction: column; align-items: center;
    gap: 20px; text-align: center; padding: 40px 20px; width: 100%; max-width: 480px;
  }
  #end-screen.show { display: flex; }
  #end-title { font-size: 1.8rem; font-weight: bold; color: #f0b429; }
  #end-score {
    font-size: 3.5rem; font-weight: bold;
    background: linear-gradient(90deg, #2ecc71, #9b59b6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  #end-detail { font-size: 0.9rem; color: #555; }
  #btn-restart {
    background: #1e1e3a; border: 1px solid #9b59b6; border-radius: 8px;
    color: #c39bd3; padding: 12px 32px; font-size: 0.95rem; cursor: pointer;
    transition: all 0.15s;
  }
  #btn-restart:hover { background: #2a1a3a; }

  /* Results */
  #results-list { width: 100%; }
  #results-list h3 { font-size: 0.72rem; color: #333; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
  .result-row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 0.82rem;
  }
  .result-row.ok  { background: #001a08; border: 1px solid #1a3a20; }
  .result-row.err { background: #1e0000; border: 1px solid #3a1010; }
  .result-row img { width: 38px; border-radius: 4px; flex: 0 0 38px; pointer-events: none; }
  .result-row .rname { flex: 1; }
  .result-row .rname small { font-size: 0.65rem; color: #444; display: block; }
  .result-row .rstatus { font-size: 0.72rem; font-weight: bold; white-space: nowrap; }
  .result-row.ok  .rstatus { color: #2ecc71; }
  .result-row.err .rstatus { color: #e74c3c; }
</style>
</head>
<body>

<div id="topbar">
  <a class="back-btn" href="index.html">&#8592; Home</a>
  <h1>&#128683; La Banni o la Giochi?</h1>
  <div id="lang-container"></div>
</div>

<div id="scorebar">
  <div class="score-item s-correct">
    <div class="score-num" id="cnt-correct">0</div>
    <div class="score-label">Corrette</div>
  </div>
  <div class="score-sep"></div>
  <div class="score-item s-wrong">
    <div class="score-num" id="cnt-wrong">0</div>
    <div class="score-label">Sbagliate</div>
  </div>
  <div class="score-sep"></div>
  <div class="score-item s-remain">
    <div class="score-num" id="cnt-remain">0</div>
    <div class="score-label">Rimanenti</div>
  </div>
</div>

<!-- GAME VIEW -->
<div id="progress-wrap">
  <div id="progress-bar-bg"><div id="progress-bar" style="width:0%"></div></div>
  <div id="progress-label"></div>
</div>

<div id="game">

  <!-- Result: thumb up/down, shown after answer -->
  <div id="result-indicator"></div>

  <!-- Card -->
  <div id="card-wrap">
    <img id="card-img" src="" alt="">
    <div id="card-name"></div>
    <div id="card-name-en"></div>
  </div>

  <!-- Answer buttons (hidden after answering) -->
  <div id="buttons">
    <button class="ans-btn" id="btn-banned" onclick="answer(true)">
      <span class="bicon">&#128683;</span>
      <span>&#200; stata Forbidden</span>
      <span class="blabel">almeno una volta</span>
    </button>
    <button class="ans-btn" id="btn-free" onclick="answer(false)">
      <span class="bicon">&#10003;</span>
      <span>Mai Forbidden</span>
      <span class="blabel">mai nella lista rossa</span>
    </button>
  </div>

  <!-- Next arrow (shown after answering) -->
  <button id="btn-next" onclick="nextCard()">Prossima &#8594;</button>

  <div id="hint">&#8592; B = bannata &nbsp;&#8226;&nbsp; &#8594; F = mai bannata &nbsp;&#8226;&nbsp; Invio = prossima</div>
</div>

<!-- END SCREEN -->
<div id="end-screen">
  <div id="end-title">Fine del round!</div>
  <div id="end-score"></div>
  <div id="end-detail"></div>
  <button id="btn-restart" onclick="restart()">&#8635; Gioca ancora</button>
  <div id="results-list">
    <h3>Riepilogo</h3>
    <div id="results-rows"></div>
  </div>
</div>

<script src="lang.js"></script>
<script>
const ALL_CARDS = [{"en":"Cyber Jar","it":"Cyber Giara","img":"https://images.ygoprodeck.com/images/cards_small/34124316.jpg","ever_banned":true},{"en":"Exchange","it":"Scambio Illuminato","img":"https://images.ygoprodeck.com/images/cards_small/5556668.jpg","ever_banned":false},{"en":"Trap Dustshoot","it":"Trappola Botola","img":"https://images.ygoprodeck.com/images/cards_small/64697231.jpg","ever_banned":true},{"en":"Sinister Serpent","it":"Serpente Sinistro","img":"https://images.ygoprodeck.com/images/cards_small/8131171.jpg","ever_banned":true},{"en":"Ocean Dragon Lord - Neo-Daedalus","it":"Signore dei Draghi Neo Dedalo","img":"https://images.ygoprodeck.com/images/cards_small/10485110.jpg","ever_banned":false},{"en":"Skill Drain","it":"Risucchia Abilità","img":"https://images.ygoprodeck.com/images/cards_small/82732705.jpg","ever_banned":false},{"en":"Dark Strike Fighter","it":"Guerriero Colpo Oscuro","img":"https://images.ygoprodeck.com/images/cards_small/32646477.jpg","ever_banned":true},{"en":"Mefist the Infernal General","it":"Mefist il Generale Infernale","img":"https://images.ygoprodeck.com/images/cards_small/46820049.jpg","ever_banned":false},{"en":"Dark Armed Dragon","it":"Drago Armato Oscuro","img":"https://images.ygoprodeck.com/images/cards_small/65192027.jpg","ever_banned":false},{"en":"Butterfly Dagger - Elma","it":"Pugnale a Farfalla","img":"https://images.ygoprodeck.com/images/cards_small/69243953.jpg","ever_banned":true},{"en":"Chaos Emperor Dragon - Envoy of the End","it":"Drago Imperatore del Caos","img":"https://images.ygoprodeck.com/images/cards_small/82301904.jpg","ever_banned":true},{"en":"Future Fusion","it":"Fusione Futura","img":"https://images.ygoprodeck.com/images/cards_small/77565204.jpg","ever_banned":true},{"en":"Imperial Order","it":"Ordine Imperiale","img":"https://images.ygoprodeck.com/images/cards_small/61740673.jpg","ever_banned":true},{"en":"Reasoning","it":"Ragionando","img":"https://images.ygoprodeck.com/images/cards_small/58577036.jpg","ever_banned":false},{"en":"Witch of the Black Forest","it":"Strega della Foresta Nera","img":"https://images.ygoprodeck.com/images/cards_small/78010363.jpg","ever_banned":true},{"en":"Creature Swap","it":"Scambio Creature","img":"https://images.ygoprodeck.com/images/cards_small/31036355.jpg","ever_banned":false},{"en":"Des Lacooda","it":"Des Lacooda","img":"https://images.ygoprodeck.com/images/cards_small/2326738.jpg","ever_banned":false},{"en":"Super Polymerization","it":"Super Polimerizzazione","img":"https://images.ygoprodeck.com/images/cards_small/48130397.jpg","ever_banned":true},{"en":"Tribe-Infecting Virus","it":"Tribe-Infecting Virus","img":"https://images.ygoprodeck.com/images/cards_small/33184167.jpg","ever_banned":true},{"en":"Pot of Desires","it":"Pot of Desires","img":"https://images.ygoprodeck.com/images/cards_small/35261759.jpg","ever_banned":false},{"en":"Demise, King of Armageddon","it":"Demise, Re dell'Armageddon","img":"https://images.ygoprodeck.com/images/cards_small/72426662.jpg","ever_banned":false},{"en":"Number 51: Finisher the Strong Arm","it":"Numero 51: Finitore","img":"https://images.ygoprodeck.com/images/cards_small/56292140.jpg","ever_banned":false},{"en":"Solemn Judgment","it":"Giudizio Solenne","img":"https://images.ygoprodeck.com/images/cards_small/41420027.jpg","ever_banned":true},{"en":"Fairy Box","it":"Scatola Fatata","img":"https://images.ygoprodeck.com/images/cards_small/21598948.jpg","ever_banned":false}];

let deck = [], current = null, idx = 0, correct = 0, wrong = 0, history = [];
let waiting = false; // true = answered, waiting for "next"

function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function name(card) {
  return getLang() === 'it' ? card.it : card.en;
}

/* ---- State helpers ---- */
function showButtons()  {
  document.getElementById('buttons').style.visibility  = 'visible';
  document.getElementById('btn-next').classList.remove('visible');
  document.getElementById('result-indicator').classList.remove('show');
  document.getElementById('result-indicator').textContent = '';
  document.getElementById('card-img').className = '';
}
function showResult(correct) {
  document.getElementById('buttons').style.visibility = 'hidden';
  const ind = document.getElementById('result-indicator');
  ind.textContent = correct ? '👍' : '👎';
  ind.classList.add('show');
  document.getElementById('card-img').className = correct ? 'correct' : 'wrong';
  document.getElementById('btn-next').classList.add('visible');
}

/* ---- Core flow ---- */
function restart() {
  correct = 0; wrong = 0; idx = 0; history = []; waiting = false;
  deck = shuffle([...ALL_CARDS]);
  document.getElementById('end-screen').classList.remove('show');
  document.getElementById('progress-wrap').style.display = 'block';
  document.getElementById('game').style.display = 'flex';
  document.getElementById('scorebar').style.display = 'flex';
  loadCard();
}

function loadCard() {
  if (idx >= deck.length) { endGame(); return; }
  current = deck[idx];
  waiting = false;
  document.getElementById('card-img').src = current.img;
  document.getElementById('card-name').textContent = name(current);
  document.getElementById('card-name-en').textContent = getLang() !== 'en' ? current.en : '';
  showButtons();
  updateScore();
}

function answer(guessBanned) {
  if (waiting) return;
  waiting = true;
  const ok = (guessBanned === current.ever_banned);
  if (ok) correct++; else wrong++;
  history.push({ card: current, ok });
  showResult(ok);
  updateScore();
}

function nextCard() {
  if (!waiting) return;
  idx++;
  loadCard();
}

function updateScore() {
  document.getElementById('cnt-correct').textContent = correct;
  document.getElementById('cnt-wrong').textContent   = wrong;
  document.getElementById('cnt-remain').textContent  = deck.length - idx;
  document.getElementById('progress-bar').style.width = (idx / deck.length * 100) + '%';
  document.getElementById('progress-label').textContent = (idx + 1) + ' / ' + deck.length;
}

function endGame() {
  document.getElementById('game').style.display = 'none';
  document.getElementById('progress-wrap').style.display = 'none';
  document.getElementById('scorebar').style.display = 'none';
  const end = document.getElementById('end-screen');
  end.classList.add('show');
  const pct = Math.round(correct / deck.length * 100);
  document.getElementById('end-score').textContent = correct + ' / ' + deck.length;
  document.getElementById('end-detail').textContent = pct + '% corrette · ' + wrong + ' errori';
  document.getElementById('results-rows').innerHTML = history.map(h =>
    '<div class="result-row ' + (h.ok ? 'ok' : 'err') + '">' +
    '<img src="' + h.card.img + '" alt="">' +
    '<div class="rname"><b>' + name(h.card) + '</b><small>' + h.card.en + '</small></div>' +
    '<div class="rstatus">' + (h.card.ever_banned ? '🚫 Forbidden' : '✅ Mai Forbidden') + '</div>' +
    '</div>'
  ).join('');
}

/* ---- Keyboard ---- */
document.addEventListener('keydown', e => {
  if (!waiting) {
    if (e.key === 'ArrowLeft'  || e.key === 'b' || e.key === 'B') answer(true);
    if (e.key === 'ArrowRight' || e.key === 'f' || e.key === 'F') answer(false);
  } else {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') nextCard();
  }
});

/* ---- Lang ---- */
initLangSwitcher('lang-container', () => {
  if (current) {
    document.getElementById('card-name').textContent = name(current);
    document.getElementById('card-name-en').textContent = getLang() !== 'en' ? current.en : '';
  }
});

restart();
</script>
</body>
</html>

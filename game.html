<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Banni o la Giochi?</title>
<link rel="stylesheet" href="lang.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #07071a; color: #e0e0e0;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  }
  #topbar {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 10px 20px; background: #12122a;
    border-bottom: 2px solid #9b59b6;
  }
  .back-btn {
    background: none; border: 1px solid #444; border-radius: 6px;
    color: #aaa; padding: 4px 12px; cursor: pointer; font-size: 0.8rem;
    text-decoration: none; display: flex; align-items: center; gap: 5px;
  }
  .back-btn:hover { border-color: #9b59b6; color: #c39bd3; }
  #topbar h1 { font-size: 1rem; color: #c39bd3; }
  #lang-container { margin-left: auto; }

  #scorebar {
    display: flex; gap: 24px; padding: 10px 24px;
    background: #0f0f20; border-bottom: 1px solid #1a1a2a;
    width: 100%; justify-content: center; align-items: center;
  }
  .score-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .score-num { font-size: 1.4rem; font-weight: bold; }
  .score-label { font-size: 0.7rem; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
  #score-correct .score-num { color: #2ecc71; }
  #score-wrong   .score-num { color: #e74c3c; }
  #score-remaining .score-num { color: #9b59b6; }
  .score-sep { width: 1px; height: 32px; background: #1a1a2a; }

  #game {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px; width: 100%; max-width: 520px; gap: 24px;
  }
  #card-area { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
  #progress-bar-wrap { width: 100%; background: #1a1a2a; border-radius: 4px; height: 5px; overflow: hidden; }
  #progress-bar { height: 5px; background: linear-gradient(90deg, #9b59b6, #c39bd3); border-radius: 4px; transition: width 0.4s ease; }
  #card-counter { font-size: 0.72rem; color: #444; align-self: flex-end; }

  #card-frame {
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 12px 48px rgba(155,89,182,0.25), 0 4px 16px rgba(0,0,0,0.6);
    transition: box-shadow 0.2s;
  }
  #card-frame.correct-flash { box-shadow: 0 0 32px rgba(46,204,113,0.6); }
  #card-frame.wrong-flash   { box-shadow: 0 0 32px rgba(192,57,43,0.6); }
  #card-frame.flip { animation: flipCard 0.35s ease; }
  @keyframes flipCard {
    0%   { transform: rotateY(0deg); opacity: 1; }
    50%  { transform: rotateY(90deg); opacity: 0.3; }
    100% { transform: rotateY(0deg); opacity: 1; }
  }
  #card-img { display: block; width: 240px; height: auto; border-radius: 14px; }
  #card-name { font-size: 1.05rem; font-weight: bold; color: #c39bd3; text-align: center; margin-top: 4px; }
  #card-name-en { font-size: 0.7rem; color: #333; text-align: center; }

  #buttons { display: flex; gap: 16px; width: 100%; }
  .answer-btn {
    flex: 1; padding: 16px 10px; border-radius: 12px;
    font-size: 0.92rem; font-weight: bold; cursor: pointer;
    border: 2px solid transparent; transition: all 0.15s;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .answer-btn .btn-icon { font-size: 1.8rem; }
  .answer-btn .btn-label { font-size: 0.72rem; opacity: 0.7; }
  #btn-banned { background: #1e0000; border-color: #c0392b; color: #e74c3c; }
  #btn-banned:hover:not(:disabled) { background: #300000; border-color: #e74c3c; transform: translateY(-3px); box-shadow: 0 6px 20px rgba(192,57,43,0.3); }
  #btn-free   { background: #001a08; border-color: #27ae60; color: #2ecc71; }
  #btn-free:hover:not(:disabled)   { background: #002a10; border-color: #2ecc71; transform: translateY(-3px); box-shadow: 0 6px 20px rgba(39,174,96,0.3); }
  .answer-btn:disabled { opacity: 0.35; cursor: default; transform: none !important; box-shadow: none !important; }

  #feedback {
    width: 100%; border-radius: 12px; padding: 16px 20px;
    text-align: center; display: none; flex-direction: column; align-items: center; gap: 8px;
  }
  #feedback.correct { background: #001a08; border: 1px solid #27ae60; color: #2ecc71; display: flex; }
  #feedback.wrong   { background: #1e0000; border: 1px solid #c0392b; color: #e74c3c; display: flex; }
  #feedback-icon  { font-size: 2rem; }
  #feedback-text  { font-weight: bold; font-size: 1rem; }
  #feedback-detail { font-size: 0.8rem; opacity: 0.85; line-height: 1.4; }
  #btn-next {
    margin-top: 6px; background: #1e1e3a; border: 1px solid #444;
    border-radius: 6px; color: #ccc; padding: 8px 24px;
    font-size: 0.82rem; cursor: pointer; transition: all 0.12s;
  }
  #btn-next:hover { background: #2a2a4a; border-color: #9b59b6; color: #c39bd3; }
  #shortcut-hint { font-size: 0.65rem; color: #252535; text-align: center; }

  #end-screen {
    display: none; flex-direction: column; align-items: center;
    gap: 20px; text-align: center; padding: 40px 20px; width: 100%; max-width: 520px;
  }
  #end-screen.visible { display: flex; }
  #end-title { font-size: 1.8rem; font-weight: bold; color: #f0b429; }
  #end-score {
    font-size: 3.5rem; font-weight: bold;
    background: linear-gradient(90deg, #2ecc71, #9b59b6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  #end-detail { font-size: 0.9rem; color: #555; }
  #btn-restart {
    background: #1e1e3a; border: 1px solid #9b59b6; border-radius: 8px;
    color: #c39bd3; padding: 12px 32px; font-size: 0.95rem; cursor: pointer;
    transition: all 0.15s;
  }
  #btn-restart:hover { background: #2a1a3a; }

  #results-list { width: 100%; padding: 0 0 40px; }
  #results-list h3 { font-size: 0.75rem; color: #333; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
  .result-row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 0.82rem;
  }
  .result-row.ok  { background: #001a08; border: 1px solid #1a3a20; }
  .result-row.err { background: #1e0000; border: 1px solid #3a1010; }
  .result-row img { width: 38px; border-radius: 4px; flex: 0 0 38px; }
  .result-row .rname { flex: 1; }
  .result-row .rstatus { font-size: 0.7rem; font-weight: bold; white-space: nowrap; }
  .result-row.ok  .rstatus { color: #2ecc71; }
  .result-row.err .rstatus { color: #e74c3c; }
</style>
</head>
<body>

<div id="topbar">
  <a class="back-btn" href="index.html">&#8592; Home</a>
  <h1>&#128683; La Banni o la Giochi?</h1>
  <div id="lang-container"></div>
</div>

<div id="scorebar">
  <div class="score-item" id="score-correct">
    <div class="score-num" id="cnt-correct">0</div>
    <div class="score-label">Corrette</div>
  </div>
  <div class="score-sep"></div>
  <div class="score-item" id="score-wrong">
    <div class="score-num" id="cnt-wrong">0</div>
    <div class="score-label">Sbagliate</div>
  </div>
  <div class="score-sep"></div>
  <div class="score-item" id="score-remaining">
    <div class="score-num" id="cnt-remaining">0</div>
    <div class="score-label">Rimanenti</div>
  </div>
</div>

<div id="game">
  <div id="card-area">
    <div id="progress-bar-wrap"><div id="progress-bar" style="width:0%"></div></div>
    <div id="card-counter"></div>
    <div id="card-frame"><img id="card-img" src="" alt=""></div>
    <div id="card-name"></div>
    <div id="card-name-en"></div>
  </div>

  <div id="buttons">
    <button class="answer-btn" id="btn-banned" onclick="answer(true)">
      <span class="btn-icon">&#128683;</span>
      <span>&#200; stata Bannata</span>
      <span class="btn-label">nella storia TCG</span>
    </button>
    <button class="answer-btn" id="btn-free" onclick="answer(false)">
      <span class="btn-icon">&#10003;</span>
      <span>Mai Bannata</span>
      <span class="btn-label">sempre libera</span>
    </button>
  </div>

  <div id="feedback">
    <div id="feedback-icon"></div>
    <div id="feedback-text"></div>
    <div id="feedback-detail"></div>
    <button id="btn-next" onclick="nextCard()">Prossima carta &#8594;</button>
  </div>

  <div id="shortcut-hint">&#8592; / B = bannata &nbsp;&#8226;&nbsp; &#8594; / F = mai bannata &nbsp;&#8226;&nbsp; Invio = prossima</div>
</div>

<div id="end-screen">
  <div id="end-title">Fine del round!</div>
  <div id="end-score"></div>
  <div id="end-detail"></div>
  <button id="btn-restart" onclick="restart()">&#8635; Gioca ancora</button>
  <div id="results-list">
    <h3>Riepilogo</h3>
    <div id="results-rows"></div>
  </div>
</div>

<script src="lang.js"></script>
<script>
const ALL_CARDS = [{"en": "Cyber Jar", "it": "Cyber Giara", "img": "https://images.ygoprodeck.com/images/cards_small/34124316.jpg", "ever_banned": true}, {"en": "Exchange", "it": "Scambio Illuminato", "img": "https://images.ygoprodeck.com/images/cards_small/5556668.jpg", "ever_banned": false}, {"en": "Trap Dustshoot", "it": "Trappola Botola", "img": "https://images.ygoprodeck.com/images/cards_small/64697231.jpg", "ever_banned": true}, {"en": "Sinister Serpent", "it": "Serpente Sinistro", "img": "https://images.ygoprodeck.com/images/cards_small/8131171.jpg", "ever_banned": true}, {"en": "Ocean Dragon Lord - Neo-Daedalus", "it": "Signore dei Draghi Neo Dedalo", "img": "https://images.ygoprodeck.com/images/cards_small/10485110.jpg", "ever_banned": false}, {"en": "Skill Drain", "it": "Risucchia Abilità", "img": "https://images.ygoprodeck.com/images/cards_small/82732705.jpg", "ever_banned": true}, {"en": "Dark Strike Fighter", "it": "Guerriero Colpo Oscuro", "img": "https://images.ygoprodeck.com/images/cards_small/32646477.jpg", "ever_banned": true}, {"en": "Mefist the Infernal General", "it": "Mefist il Generale Infernale", "img": "https://images.ygoprodeck.com/images/cards_small/46820049.jpg", "ever_banned": false}, {"en": "Dark Armed Dragon", "it": "Drago Armato Oscuro", "img": "https://images.ygoprodeck.com/images/cards_small/65192027.jpg", "ever_banned": true}, {"en": "Butterfly Dagger - Elma", "it": "Pugnale a Farfalla", "img": "https://images.ygoprodeck.com/images/cards_small/69243953.jpg", "ever_banned": true}, {"en": "Chaos Emperor Dragon - Envoy of the End", "it": "Drago Imperatore del Caos", "img": "https://images.ygoprodeck.com/images/cards_small/82301904.jpg", "ever_banned": true}, {"en": "Future Fusion", "it": "Fusione Futura", "img": "https://images.ygoprodeck.com/images/cards_small/77565204.jpg", "ever_banned": true}, {"en": "Imperial Order", "it": "Ordine Imperiale", "img": "https://images.ygoprodeck.com/images/cards_small/61740673.jpg", "ever_banned": true}, {"en": "Reasoning", "it": "Ragionando", "img": "https://images.ygoprodeck.com/images/cards_small/58577036.jpg", "ever_banned": true}, {"en": "Witch of the Black Forest", "it": "Strega della Foresta Nera", "img": "https://images.ygoprodeck.com/images/cards_small/78010363.jpg", "ever_banned": true}, {"en": "Creature Swap", "it": "Scambio Creature", "img": "https://images.ygoprodeck.com/images/cards_small/31036355.jpg", "ever_banned": true}, {"en": "Des Lacooda", "it": "Des Lacooda", "img": "https://images.ygoprodeck.com/images/cards_small/2326738.jpg", "ever_banned": false}, {"en": "Super Polymerization", "it": "Super Polimerizzazione", "img": "https://images.ygoprodeck.com/images/cards_small/48130397.jpg", "ever_banned": true}, {"en": "Tribe-Infecting Virus", "it": "Tribe-Infecting Virus", "img": "https://images.ygoprodeck.com/images/cards_small/33184167.jpg", "ever_banned": true}, {"en": "Pot of Desires", "it": "Pot of Desires", "img": "https://images.ygoprodeck.com/images/cards_small/35261759.jpg", "ever_banned": true}, {"en": "Demise, King of Armageddon", "it": "Demise, Re dell'Armageddon", "img": "https://images.ygoprodeck.com/images/cards_small/72426662.jpg", "ever_banned": true}, {"en": "Number 51: Finisher the Strong Arm", "it": "Numero 51: Finitore", "img": "https://images.ygoprodeck.com/images/cards_small/56292140.jpg", "ever_banned": false}, {"en": "Solemn Judgment", "it": "Giudizio Solenne", "img": "https://images.ygoprodeck.com/images/cards_small/41420027.jpg", "ever_banned": true}, {"en": "Fairy Box", "it": "Scatola Fatata", "img": "https://images.ygoprodeck.com/images/cards_small/21598948.jpg", "ever_banned": false}];

let deck = [], current = null, idx = 0, correct = 0, wrong = 0;
let answered = false, history = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getCardDisplayName(card) {
  const lang = getLang();
  if (lang === 'it') return card.it;
  return card.en;
}

function restart() {
  correct = 0; wrong = 0; idx = 0; history = [];
  deck = shuffle([...ALL_CARDS]);
  document.getElementById('end-screen').classList.remove('visible');
  document.getElementById('game').style.display = 'flex';
  document.getElementById('scorebar').style.display = 'flex';
  updateScore();
  showCard();
}

function updateScore() {
  document.getElementById('cnt-correct').textContent = correct;
  document.getElementById('cnt-wrong').textContent = wrong;
  document.getElementById('cnt-remaining').textContent = deck.length - idx;
  document.getElementById('progress-bar').style.width = (idx / deck.length * 100) + '%';
  document.getElementById('card-counter').textContent = (idx + 1) + ' / ' + deck.length;
}

function showCard() {
  if (idx >= deck.length) { endGame(); return; }
  current = deck[idx];
  answered = false;
  const frame = document.getElementById('card-frame');
  frame.className = '';
  void frame.offsetWidth;
  frame.classList.add('flip');
  document.getElementById('card-img').src = current.img;
  document.getElementById('card-name').textContent = getCardDisplayName(current);
  document.getElementById('card-name-en').textContent = getLang() !== 'en' ? current.en : '';
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('feedback').className = '';
  document.getElementById('btn-banned').disabled = false;
  document.getElementById('btn-free').disabled = false;
  updateScore();
}

function answer(guessBanned) {
  if (answered) return;
  answered = true;
  const isCorrect = (guessBanned === current.ever_banned);
  if (isCorrect) correct++; else wrong++;
  history.push({ card: current, guessed: guessBanned, correct: isCorrect });

  // Flash card border
  const frame = document.getElementById('card-frame');
  frame.classList.add(isCorrect ? 'correct-flash' : 'wrong-flash');

  const fb = document.getElementById('feedback');
  fb.className = isCorrect ? 'correct' : 'wrong';
  document.getElementById('feedback-icon').textContent = isCorrect ? '✅' : '❌';
  document.getElementById('feedback-text').textContent = isCorrect
    ? 'Esatto!'
    : (guessBanned ? 'Sbagliato — non è mai stata bannata!' : 'Sbagliato — è stata bannata!');
  document.getElementById('feedback-detail').textContent = current.ever_banned
    ? getCardDisplayName(current) + ' è stata nella Forbidden/Limited list TCG.'
    : getCardDisplayName(current) + ' non è mai stata nella Forbidden/Limited list TCG.';

  document.getElementById('btn-banned').disabled = true;
  document.getElementById('btn-free').disabled = true;
  updateScore();
}

function nextCard() { idx++; showCard(); }

function endGame() {
  document.getElementById('game').style.display = 'none';
  document.getElementById('scorebar').style.display = 'none';
  const end = document.getElementById('end-screen');
  end.classList.add('visible');
  const pct = Math.round(correct / deck.length * 100);
  document.getElementById('end-score').textContent = correct + ' / ' + deck.length;
  document.getElementById('end-detail').textContent = pct + '% corrette · ' + wrong + ' errori';

  document.getElementById('results-rows').innerHTML = history.map(h =>
    '<div class="result-row ' + (h.correct ? 'ok' : 'err') + '">' +
    '<img src="' + h.card.img + '" alt="">' +
    '<div class="rname">' +
    '<div>' + getCardDisplayName(h.card) + '</div>' +
    '<div style="font-size:0.68rem;color:#444">' + h.card.en + '</div>' +
    '</div>' +
    '<div class="rstatus">' + (h.card.ever_banned ? '🚫 Bannata' : '✅ Mai bannata') + '</div>' +
    '</div>'
  ).join('');
}

document.addEventListener('keydown', e => {
  if (!answered) {
    if (e.key === 'ArrowLeft'  || e.key === 'b' || e.key === 'B') answer(true);
    if (e.key === 'ArrowRight' || e.key === 'f' || e.key === 'F') answer(false);
  } else {
    if (e.key === 'Enter' || e.key === ' ') nextCard();
  }
});

initLangSwitcher('lang-container', () => {
  if (current) {
    document.getElementById('card-name').textContent = getCardDisplayName(current);
    document.getElementById('card-name-en').textContent = getLang() !== 'en' ? current.en : '';
  }
});

restart();
</script>
</body>
</html>
